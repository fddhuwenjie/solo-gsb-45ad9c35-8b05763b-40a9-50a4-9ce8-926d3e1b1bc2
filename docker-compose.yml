services:
  web:
    build: .
    image: incident-causal-graph:latest
    container_name: incident-causal-graph
    ports:
      - "8000:8000"
    volumes:
      - causal-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health').status==200 else 1)"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 5s

volumes:
  causal-data:
